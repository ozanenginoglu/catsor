[package]
name = "catsor"
version = "0.2.0"
edition = "2024"
description = "Top-down procedural desktop cat companion for Linux (X11) and Windows that leisurely follows the cursor"
license = "Apache-2.0"
repository = "https://github.com/ozanenginoglu/catsor"
readme = "README.md"
keywords = ["desktop-pet", "cat", "x11", "overlay", "animation"]
categories = ["games"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
glam = "0.29"
tiny-skia = "0.11"

[target.'cfg(not(windows))'.dependencies]
x11rb = { version = "0.13", features = ["randr", "shape", "xfixes"] }

[target.'cfg(any(windows, windows_check))'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(windows_check)"] }
